name: Validate config

on:
  push:
    paths:
      - "monitors.json"
      - "monitor.py"
      - ".github/workflows/*.yml"
  pull_request:
    paths:
      - "monitors.json"
      - "monitor.py"
      - ".github/workflows/*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate monitors.json
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Compile monitor.py
        run: python3 -m py_compile monitor.py

      - name: Validate configuration
        run: python3 monitor.py --config monitors.json --validate

      - name: Self test
        run: python3 selftest.py
